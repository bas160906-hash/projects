<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wordloop">
  <title>Wordloop</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <div class="ambient ambient-no" aria-hidden="true"></div>
  <div class="ambient ambient-yes" aria-hidden="true"></div>
  <main class="app">
    <header class="header">
      <button id="sets-button" class="sets-button" aria-label="Выбрать наборы"><span id="sets-title"></span><span aria-hidden="true">⌄</span></button>
      <button id="typing-toggle" class="icon-button" aria-label="Ввод перевода" aria-pressed="false" title="Ввод перевода">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 15h10"/></svg>
      </button>
      <button id="import-button" class="icon-button" aria-label="Добавить набор">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="mode-switch" role="group" aria-label="Режим тренировки">
      <button id="cards-mode" aria-pressed="true">Карточки</button>
      <button id="pairs-mode" aria-pressed="false">Пары</button>
    </div>
    <div class="toolbar">
      <select id="direction-select" aria-label="Направление перевода">
        <option value="en-ru">EN → RU</option>
        <option value="ru-en">RU → EN</option>
      </select>
      <select id="order-select" aria-label="Порядок карточек">
        <option value="source">По порядку</option>
        <option value="random">Случайно</option>
      </select>
      <button id="reset-button" class="icon-button" aria-label="Начать заново">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg>
      </button>
    </div>
    <div class="progress-row">
      <div id="progress-track" class="progress-track" role="progressbar" aria-label="Знакомые слова" aria-valuemin="0"><div id="progress-fill"></div></div>
      <span id="progress-count" aria-live="polite">0 / 20</span>
    </div>
    <section id="pairs-stage" class="pairs-stage hidden" aria-label="Сопоставление слов">
      <div id="pairs-grid" class="pairs-grid"></div>
      <div id="pairs-feedback" class="pairs-feedback hidden" role="status">
        <span id="pairs-correction"></span>
        <button id="pairs-next" class="primary-button">Дальше</button>
      </div>
      <div id="pairs-complete" class="pairs-complete hidden">
        <span class="complete-mark" aria-hidden="true">✓</span>
        <h1 id="pairs-complete-title">Готово</h1>
        <button id="pairs-check" class="primary-button">Проверить себя</button>
        <button id="pairs-reset" class="text-button">Ещё раз</button>
      </div>
      <span id="pairs-phase" class="pairs-phase" aria-live="polite"></span>
    </section>
    <section class="card-stage" aria-label="Карточки">
      <div class="stack-back" aria-hidden="true"></div>
      <div id="next-card" class="next-card" aria-hidden="true"><span id="next-word"></span></div>
      <article id="flashcard" class="flashcard" tabindex="0" role="button" aria-label="Открыть перевод">
        <span id="card-language" class="card-language">EN</span>
        <span class="swipe-mark swipe-no" aria-hidden="true">×</span>
        <span class="swipe-mark swipe-yes" aria-hidden="true">✓</span>
        <div class="card-content">
          <div id="word" class="word"></div>
          <div id="pronunciation" class="pronunciation"></div>
          <form id="typed-form" class="typed-form hidden" autocomplete="off">
            <input id="typed-answer" type="text" aria-label="Твой перевод" placeholder="Перевод на русский" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" maxlength="500">
          </form>
          <div id="answer-block" class="answer-block" aria-hidden="true"><span id="answer-feedback" class="answer-feedback hidden">Верный перевод</span><span id="answer"></span></div>
          <button id="typed-submit" type="submit" form="typed-form" class="primary-button typed-submit hidden">Проверить</button>
        </div>
        <span id="tap-hint" class="tap-hint">Нажми, чтобы открыть</span>
      </article>
      <div id="empty-state" class="empty-state hidden">
        <span class="complete-mark" aria-hidden="true">✓</span>
        <h1 id="empty-title">Готово</h1>
        <button id="empty-reset" class="primary-button">Ещё раз</button>
      </div>
    </section>
    <div id="card-actions" class="card-actions">
      <button id="again-button" class="action-button again"><span aria-hidden="true">×</span>Don’t know</button>
      <button id="know-button" class="action-button know">Know<span aria-hidden="true">✓</span></button>
    </div>
  </main>
  <input id="file-input" type="file" accept=".md,.markdown,.txt,.csv,.tsv,text/markdown,text/plain,text/csv" hidden>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="import-dialog" class="modal">
    <form method="dialog"><button class="icon-button modal-close" aria-label="Закрыть">×</button></form>
    <h2>Новый набор</h2>
    <input id="import-name" class="name-input" aria-label="Название набора" placeholder="Название" maxlength="80">
    <div id="drop-zone" class="drop-zone"><button id="dialog-file-button" class="primary-button">Загрузить .md</button></div>
    <details>
      <summary>Вставить таблицу</summary>
      <textarea id="paste-input" aria-label="Markdown-таблица слов" placeholder="| English | Русский |&#10;|---|---|&#10;| word | слово |" rows="5"></textarea>
      <button id="paste-import" class="primary-button">Добавить</button>
    </details>
    <details class="format-example">
      <summary>Формат файла</summary>
      <pre>| English | Русский |
|---|---|
| word | слово |</pre>
    </details>
  </dialog>
  <dialog id="sets-dialog" class="modal sets-modal">
    <form method="dialog"><button class="icon-button modal-close" aria-label="Закрыть">×</button></form>
    <h2>Наборы</h2>
    <div id="sets-list"></div>
    <p id="no-sets" class="muted hidden">Пока нет наборов</p>
    <div class="sets-footer"><span id="selection-count" class="muted" aria-live="polite"></span><button id="start-training" class="primary-button">Начать</button></div>
  </dialog>
  <dialog id="delete-dialog" class="modal">
    <form method="dialog"><button class="icon-button modal-close" aria-label="Закрыть">×</button></form>
    <h2>Удалить набор?</h2>
    <p id="delete-name" class="delete-name"></p>
    <div class="delete-actions"><button id="cancel-delete" class="primary-button">Отмена</button><button id="confirm-delete" class="action-button again">Удалить</button></div>
  </dialog>
  <script src="app.js?v=6"></script>
  <script src="pairs.js?v=6"></script>
</body>
</html>
